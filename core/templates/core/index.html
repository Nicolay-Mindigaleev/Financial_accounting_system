<tbody>
    {% for transaction in transactions %}
    <tr>
        <td>{{ transaction.date }}</td>
        <td>{{ transaction.category.category_name }}</td>
        <td>{{ transaction.operation }}</td>
        <td>{{ transaction.transaction_sum }}</td>
        <td>{{ transaction.description }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="5">Нет транзакций</td>
    </tr>
    {% endfor %}
</tbody>
<h3>Добавить транзакцию</h3>
<form method="post" action="{% url 'add_transaction' %}">
    {% csrf_token %}
    <select name="category">
        {% for category in categories %}
            <option value="{{ category.category_id }}">{{ category.category_name }}</option>
        {% endfor %}
    </select>
    <select name="operation">
        <option value="Income">Доход</option>
        <option value="Consumption">Расход</option>
    </select>
    <input type="number" name="amount" placeholder="Сумма" required>
    <input type="date" name="date" required>
    <textarea name="description" placeholder="Описание"></textarea>
    <button type="submit">Сохранить</button>
</form>
