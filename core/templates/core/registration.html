{% extends 'core/base.html' %}

{% block content %}
<style>
    .form-field-group {
        margin-bottom: 15px;
        max-width: 320px;
    }
    .form-field-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        font-size: 14px;
    }
    .form-field-group input[type="text"],
    .form-field-group input[type="password"],
    .form-field-group input[type="email"] {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #ccc;
        font-size: 14px;
        box-sizing: border-box;
    }
    .form-field-group .helptext {
        display: block;
        font-size: 11px;
        color: #777;
        margin-top: 3px;
        line-height: 1.3;
    }
    .error-box {
        color: #b30000;
        border: 1px solid #ccc;
        background-color: #fff8f8;
        padding: 10px;
        margin-bottom: 15px;
        max-width: 320px;
        font-size: 13px;
        box-sizing: border-box;
    }
    form p {
        margin: 0 0 15px 0;
        max-width: 320px;
    }
    form p label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        font-size: 14px;
    }
</style>

<h2>Регистрация</h2>

{% if form.errors %}
    <div class="error-box">
        Пожалуйста, проверьте правильность заполнения полей.
    </div>
{% endif %}

<form method="post">
    {% csrf_token %}
    
    <div class="form-field-group">
        {{ form.as_p }}
    </div>
    
    <p style="margin-top: 25px;">
        <button type="submit" class="button">Зарегистрироваться</button>
        <a href="{% url 'index' %}" class="button">Отмена</a>
    </p>
</form>
{% endblock %}
