{% extends 'core/base.html' %}

{% block content %}
<h2>Редактировать транзакцию</h2>
<form method="post">
    {% csrf_token %}
    <p>
        <label>Категория:</label>
        <select name="category" required>
            {% for category in categories %}
                <option value="{{ category.category_id }}" {% if category.category_id == transaction.category.category_id %}selected{% endif %}>
                    {{ category.category_name }}
                </option>
            {% endfor %}
        </select>
    </p>
    <p>
        <label>Тип:</label>
        <select name="operation" required>
            <option value="Income" {% if transaction.operation == 'Income' %}selected{% endif %}>Доход</option>
            <option value="Consumption" {% if transaction.operation == 'Consumption' %}selected{% endif %}>Расход</option>
        </select>
    </p>
    <p>
        <label>Сумма:</label>
        <input type="number" step="0.01" name="amount" value="{{ transaction.transaction_sum }}" required>
    </p>
    <p>
        <label>Дата:</label>
        <input type="date" name="date" value="{{ transaction.date|date:'Y-m-d' }}" required>
    </p>
    <p>
        <label>Описание:</label>
        <textarea name="description" rows="2" cols="30">{{ transaction.description }}</textarea>
    </p>
    <button type="submit">Сохранить</button>
    <a href="{% url 'index' %}">Отмена</a>
</form>
{% endblock %}
