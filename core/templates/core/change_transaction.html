{% extends 'core/base.html' %}

{% block content %}
<style>
    .form-field-group {
        margin-bottom: 15px;
        max-width: 320px;
    }
    .form-field-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        font-size: 14px;
    }
    .form-element {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #ccc;
        font-size: 14px;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }
</style>

<h2>Редактировать транзакцию</h2>

<form method="post" action="{% url 'change_transaction' %}">
    {% csrf_token %}
    
    <div class="form-field-group">
        <label>Выберите транзакцию для изменения:</label>
        <select name="transaction_id" class="form-element" required>
            {% for tx in transactions %}
                <option value="{{ tx.id }}">
                    {{ tx.date|date:"d.m.Y" }} — {{ tx.category.category_name }} — {{ tx.transaction_sum }} ₽
                </option>
            {% endfor %}
        </select>
    </div>

    <hr style="max-width: 320px; margin: 20px 0; border: 0; border-top: 1px solid #ccc;">
    <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Введите новые значения ниже:</p>

    <div class="form-field-group">
        <label>Новая категория:</label>
        <select name="category" class="form-element" required>
            {% for category in categories %}
                <option value="{{ category.category_id }}">{{ category.category_name }}</option>
            {% endfor %}
        </select>
    </div>
    
    <div class="form-field-group">
        <label>Новый тип:</label>
        <select name="operation" class="form-element" required>
            <option value="Income">Доход</option>
            <option value="Consumption">Расход</option>
        </select>
    </div>
    
    <div class="form-field-group">
        <label>Новая сумма:</label>
        <input type="number" step="0.01" name="amount" class="form-element" required>
    </div>
    
    <div class="form-field-group">
        <label>Новая дата:</label>
        <input type="date" name="date" class="form-element" required>
    </div>
    
    <div class="form-field-group">
        <label>Новое описание:</label>
        <textarea name="description" class="form-element" rows="3"></textarea>
    </div>
    
    <p style="margin-top: 25px;">
        <button type="submit" class="button">Сохранить изменения</button>
        <a href="{% url 'index' %}" class="button">Отмена</a>
    </p>
</form>
{% endblock %}
