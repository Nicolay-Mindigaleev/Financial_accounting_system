{% extends 'core/base.html' %}

{% block content %}
<style>
    .form-field-group {
        margin-bottom: 15px;
        max-width: 320px;
    }
    .form-field-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        font-size: 14px;
    }
    .form-element {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #ccc;
        font-size: 14px;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }
    .field-hint {
        display: block;
        margin-top: 4px;
        font-size: 12px;
    }
</style>

<h2>Добавить транзакцию</h2>
{% if error %}
    <p style="color: #b30000; font-weight: bold; font-size: 14px;">{{ error }}</p>
{% endif %}
<form method="post" action="{% url 'add_transaction' %}">
    {% csrf_token %}
    
    <div class="form-field-group">
        <label>Категория:</label>
        <select name="category" class="form-element" required>
            {% for category in categories %}
                <option value="{{ category.category_id }}">{{ category.category_name }}</option>
            {% endfor %}
        </select>
        <a href="{% url 'add_category' %}?next={{ request.path }}" class="field-hint">Добавить новую категорию &rarr;</a>
    </div>
    
    <div class="form-field-group">
        <label>Тип:</label>
        <select name="operation" class="form-element" required>
            <option value="Income">Доход</option>
            <option value="Consumption">Расход</option>
        </select>
    </div>
    
    <div class="form-field-group">
        <label>Сумма:</label>
        <input type="number" step="0.01" name="amount" class="form-element" required>
    </div>
    
    <div class="form-field-group">
        <label>Дата:</label>
        <input type="date" name="date" class="form-element" required>
    </div>
    
    <div class="form-field-group">
        <label>Описание:</label>
        <textarea name="description" class="form-element" rows="3"></textarea>
    </div>
    
    <p style="margin-top: 25px;">
        <button type="submit" class="button">Сохранить</button>
        <a href="{% url 'index' %}" class="button">Назад</a>
    </p>
</form>
{% endblock %}
