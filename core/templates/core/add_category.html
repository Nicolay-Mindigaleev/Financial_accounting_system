<h2>Добавить категорию</h2>
<form method="post" action="{% url 'add_category' %}">
    {% csrf_token %}
    <p>
        <label>Имя категории:</label>
        <input name="category_name" required></input>
    </p>
    <button type="submit">Сохранить</button>
</form>
<a href="{% url 'index' %}">Назад</a>
